name: Shopify Stock Monitor

on:
  schedule:
    # NOTE: */5 = 288 runs/day. Review cadence before re-enabling the schedule.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs so two overlapping checks cannot race on the state push.
# cancel-in-progress: false — a queued run should wait, not be discarded.
concurrency:
  group: stock-monitor
  cancel-in-progress: false

env:
  STATE_FILE: state.json
  PRODUCT_URL: https://www.themobilemarvel.com/products/oppo-find-n6-global-version-used
  COLLECTION_URL: https://www.themobilemarvel.com/collections/used-smartphones/products.json?limit=250

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pinned to the v4 tag commit (2026-07-16). Update deliberately.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check stock
        id: check
        run: |
          set -euo pipefail

          # --- Load previous state (defensively) ---
          # state.json is writable by anything holding Contents:write, so treat
          # every field as untrusted input. Values are only ever compared, never
          # executed, but a non-integer count would silently suppress the
          # collection trigger (bash prints "integer expression expected" and the
          # test evaluates false), so coerce it here.
          prev_product=false
          prev_collection=0

          if [ -f "$STATE_FILE" ] && jq -e '.' "$STATE_FILE" >/dev/null 2>&1; then
            raw_product=$(jq -r '.product_available // false' "$STATE_FILE")
            raw_collection=$(jq -r '.collection_count // 0' "$STATE_FILE")

            if [ "$raw_product" = "true" ]; then
              prev_product=true
            fi

            if printf '%s' "$raw_collection" | grep -Eq '^[0-9]+$'; then
              prev_collection=$raw_collection
            else
              echo "::warning::state.json collection_count is not a non-negative integer ('$raw_collection') -- defaulting to 0"
            fi
          fi

          # Normalise curl's -w output. curl already emits 000 on failure, so the
          # original `|| echo "000"` could produce "000000" and confuse the
          # comparisons below. Keep the last 3 digits, default to 000.
          http_code() {
            local raw="${1:-}"
            if printf '%s' "$raw" | grep -Eq '[0-9]{3}$'; then
              printf '%s' "${raw: -3}"
            else
              printf '000'
            fi
          }

          fetch_html() {
            curl --silent --location --retry 2 --retry-delay 3 \
                 --max-time 20 --compressed \
                 -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                 -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
                 -H "Accept-Language: en-GB,en;q=0.9" \
                 -w "%{http_code}" -o "$2" "$1" || true
          }

          fetch_json() {
            curl --silent --location --retry 2 --retry-delay 3 \
                 --max-time 20 --compressed \
                 -H "User-Agent: Mozilla/5.0 (compatible; stock-monitor/1.0)" \
                 -H "Accept: application/json" \
                 -w "%{http_code}" -o "$2" "$1" || true
          }

          # --- Product check ---
          # Multi-variant page: some variants sold out, others available.
          # Simple "Sold out" grep fires on variant selector ARIA labels even when
          # another variant is purchasable. Instead, target the main CTA button
          # (name="add") specifically:
          #   - enabled (no disabled attr) = at least one variant available
          #   - disabled                   = all variants sold out
          # Perl -0777 slurps the full file so multiline tags and any attribute
          # ordering are handled correctly. Exits 0 if ANY enabled add button found.
          prod_tmp=$(mktemp)
          col_tmp=$(mktemp)
          trap 'rm -f "$prod_tmp" "$col_tmp"' EXIT

          prod_status=$(http_code "$(fetch_html "$PRODUCT_URL" "$prod_tmp")")
          product_available=$prev_product

          if [ "$prod_status" = "200" ]; then
            if perl -0777 -ne 'while (/<button\b[^>]*name=.add.[^>]*>/ig) { exit 0 if $& !~ /\bdisabled\b/i } exit 1' "$prod_tmp"; then
              product_available=true
              echo "Product check: enabled add-to-cart button found -> available=true"
            else
              product_available=false
              echo "Product check: add-to-cart button disabled or absent -> available=false"
            fi
          elif [ "$prod_status" = "404" ]; then
            product_available=false
            echo "Product check: HTTP 404 -> unpublished, available=false"
          else
            echo "::warning::Product fetch failed (HTTP $prod_status) -- keeping previous state"
          fi

          # --- Collection check ---
          col_status=$(http_code "$(fetch_json "$COLLECTION_URL" "$col_tmp")")
          collection_count=$prev_collection

          if [ "$col_status" = "200" ] && jq -e '.' "$col_tmp" >/dev/null 2>&1; then
            collection_count=$(jq '[.products[]? | select((.title // "" | ascii_downcase) | contains("find n6"))] | length' "$col_tmp")
            echo "Collection check: found $collection_count Find N6 listing(s)"
          else
            echo "::warning::Collection fetch failed (HTTP $col_status) -- keeping previous count"
          fi

          # --- Transition detection (notify only on false -> true) ---
          # KNOWN BLIND SPOT (intended): collection_count only fires on 0 -> >0.
          # A restock of the SAME listing keeps the count at 1 throughout, so only
          # the product-page button check catches it.
          product_triggered=false
          collection_triggered=false
          [ "$product_available" = "true" ] && [ "$prev_product"    != "true" ] && product_triggered=true
          [ "$collection_count"  -gt 0    ] && [ "$prev_collection" -eq 0    ] && collection_triggered=true

          notify=false
          { [ "$product_triggered" = "true" ] || [ "$collection_triggered" = "true" ]; } && notify=true

          # --- Only commit when meaningful fields change ---
          state_changed=false
          if [ "$product_available" != "$prev_product" ] || [ "$collection_count" != "$prev_collection" ]; then
            state_changed=true
            jq -n \
              --arg pa "$product_available" \
              --argjson cc "$collection_count" \
              --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '{product_available: ($pa == "true"), collection_count: $cc, last_checked: $ts}' \
              > "$STATE_FILE"
          fi

          {
            echo "product_available=$product_available"
            echo "collection_count=$collection_count"
            echo "product_triggered=$product_triggered"
            echo "collection_triggered=$collection_triggered"
            echo "state_changed=$state_changed"
            echo "notify=$notify"
          } >> "$GITHUB_OUTPUT"

      - name: Send ntfy.sh notification
        if: steps.check.outputs.notify == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRODUCT_TRIGGERED: ${{ steps.check.outputs.product_triggered }}
          COLLECTION_COUNT: ${{ steps.check.outputs.collection_count }}
        run: |
          set -euo pipefail
          [ -z "${NTFY_TOPIC:-}" ] && { echo "::warning::NTFY_TOPIC secret not set"; exit 0; }

          if [ "$PRODUCT_TRIGGERED" = "true" ]; then
            MSG="Find N6 IN STOCK - buy now! https://www.themobilemarvel.com/products/oppo-find-n6-global-version-used"
          else
            MSG="New Find N6 listing in used collection (${COLLECTION_COUNT} result(s)) - https://www.themobilemarvel.com/collections/used-smartphones"
          fi

          curl -s \
            -H "Title: Find N6 LIVE!" \
            -H "Priority: urgent" \
            -H "Tags: shopping,rotating_light" \
            -d "$MSG" \
            "https://ntfy.sh/${NTFY_TOPIC}"

      - name: Commit state change
        if: steps.check.outputs.state_changed == 'true'
        env:
          PRODUCT_AVAILABLE: ${{ steps.check.outputs.product_available }}
          COLLECTION_COUNT: ${{ steps.check.outputs.collection_count }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$STATE_FILE"

          if git diff --cached --quiet; then
            echo "Nothing staged -- skipping commit."
            exit 0
          fi

          git commit -m "state: product=${PRODUCT_AVAILABLE} collection=${COLLECTION_COUNT}"

          # The bare `git push` had no rebase guard: a concurrent run (or any other
          # commit landing on main) causes a non-fast-forward rejection and the run
          # fails with the state change lost. Retry with rebase.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              pushed=true
              break
            fi
            echo "Push attempt $attempt failed -- rebasing and retrying."
            sleep $(( attempt * 3 ))
            git pull --rebase --autostash
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push state after 5 attempts."
            exit 1
          fi
